<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TRPL Movie</title>

    <!-- Bootstrap CSS -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    >

</head>

<body>

    <!-- ========================= -->
    <!-- NAVBAR -->
    <!-- ========================= -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand" href="#">
                TRPL Movie
            </a>

            <span class="navbar-text text-white">
                Search Movie
            </span>

        </div>

    </nav>


    <!-- ========================= -->
    <!-- SEARCH -->
    <!-- ========================= -->

    <div class="container">

        <div class="row mt-5 justify-content-center">

            <div class="col-md-8">

                <h1 class="text-center">
                    Search Movie
                </h1>

                <div class="input-group mb-3">

                    <input
                        type="text"
                        class="form-control"
                        id="search-input"
                        placeholder="Movie title..."
                    >

                    <div class="input-group-append">

                        <button
                            class="btn btn-dark"
                            type="button"
                            id="button-search"
                        >
                            Search
                        </button>

                    </div>

                </div>

            </div>

        </div>


        <hr>


        <!-- ========================= -->
        <!-- MOVIE LIST -->
        <!-- ========================= -->

        <div class="container">

            <div
                class="row mt-3"
                id="movie-list"
            >

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- MODAL -->
    <!-- ========================= -->

    <div
        class="modal fade"
        id="exampleModal"
        tabindex="-1"
        aria-labelledby="exampleModalLabel"
        aria-hidden="true"
    >

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="exampleModalLabel"
                    >
                        Movie Detail
                    </h5>

                    <button
                        type="button"
                        class="close"
                        data-dismiss="modal"
                        aria-label="Close"
                    >

                        <span aria-hidden="true">
                            &times;
                        </span>

                    </button>

                </div>


                <div class="modal-body">

                    <!-- Detail film akan dimasukkan JavaScript -->

                </div>


                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-dismiss="modal"
                    >
                        Close
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <script
        src="https://code.jquery.com/jquery-3.6.0.min.js">
    </script>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="js/script.js"></script>

</body>

</html>
